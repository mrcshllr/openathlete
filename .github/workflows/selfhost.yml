# =============================================================================
# Self-hosted images of this fork
# =============================================================================
# The selfhost branch is the whole source of my own instance: upstream's main
# with my changes on top. This workflow
#
#   1. every night, merges upstream's main into selfhost and pushes it, so
#      the fork follows the main project while keeping what is only here;
#   2. builds selfhost, after that merge and on every push to it, as
#
#        ghcr.io/<owner>/openathlete-api:selfhost
#        ghcr.io/<owner>/openathlete-web:selfhost
#
#      plus a dated tag per build to roll back to.
#
# A merge that conflicts fails the run and changes nothing: neither the
# branch nor the images. It is then merged by hand (selfhost/README.md).
# A commit that was already built is skipped.
# =============================================================================
name: Self-hosted images

on:
  schedule:
    # 03:17 Berlin in winter (02:17 UTC): after upstream's evening merges
    - cron: '17 2 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Build even if this commit was already built
        type: boolean
        default: false
  push:
    branches: [selfhost]
    paths-ignore: ['**.md']

permissions:
  contents: read

concurrency:
  group: selfhost-images
  cancel-in-progress: false

env:
  UPSTREAM: openathleteorg/openathlete
  UPSTREAM_REF: main
  BRANCH: selfhost

jobs:
  source:
    name: Follow upstream
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      packages: read
    outputs:
      build: ${{ steps.check.outputs.build }}
      sha: ${{ steps.merge.outputs.sha }}
      short: ${{ steps.merge.outputs.short }}
      date: ${{ steps.merge.outputs.date }}
      upstream: ${{ steps.merge.outputs.upstream }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.BRANCH }}
          fetch-depth: 0
          # GitHub refuses its own token a push that changes a workflow file,
          # which upstream's commits sometimes do: SYNC_TOKEN is a personal
          # token allowed to (selfhost/README.md)
          token: ${{ secrets.SYNC_TOKEN || secrets.GITHUB_TOKEN }}

      - id: merge
        name: Merge upstream into the branch
        run: |
          git config user.name 'selfhost-bot'
          git config user.email 'selfhost-bot@users.noreply.github.com'
          git fetch --quiet "https://github.com/$UPSTREAM" "$UPSTREAM_REF"
          upstream=$(git rev-parse FETCH_HEAD)
          # A push to the branch is built as it is: only the nightly run and
          # a run started by hand bring upstream in
          if [ '${{ github.event_name }}' != 'push' ] \
            && ! git merge-base --is-ancestor "$upstream" HEAD; then
            if ! git merge --no-edit --quiet FETCH_HEAD; then
              echo "::error::$UPSTREAM $UPSTREAM_REF no longer merges into $BRANCH: merge it by hand, see selfhost/README.md"
              exit 1
            fi
            if ! git push --quiet origin "HEAD:$BRANCH"; then
              echo "::error::The merge could not be pushed. If upstream changed a workflow file, set the SYNC_TOKEN secret (selfhost/README.md)"
              exit 1
            fi
          fi
          {
            echo "sha=$(git rev-parse HEAD)"
            echo "short=$(git rev-parse --short=7 HEAD)"
            echo "upstream=$(git merge-base HEAD "$upstream" | cut -c1-7)"
            echo "date=$(date -u +%Y%m%d)"
          } >> "$GITHUB_OUTPUT"

      - id: check
        name: Skip if this commit was already built
        env:
          SHA: ${{ steps.merge.outputs.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          echo "$GH_TOKEN" | docker login ghcr.io -u '${{ github.actor }}' --password-stdin > /dev/null
          if [ '${{ inputs.force }}' != 'true' ] \
            && docker manifest inspect "ghcr.io/$owner/openathlete-api:src-$SHA" > /dev/null 2>&1 \
            && docker manifest inspect "ghcr.io/$owner/openathlete-web:src-$SHA" > /dev/null 2>&1; then
            echo "Already built: src-$SHA"
            echo 'build=false' >> "$GITHUB_OUTPUT"
          else
            echo 'build=true' >> "$GITHUB_OUTPUT"
          fi

  images:
    name: Build ${{ matrix.image }} image
    needs: source
    if: needs.source.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        image: [api, web]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.source.outputs.sha }}

      - id: names
        run: |
          owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          echo "image=ghcr.io/$owner/openathlete-${{ matrix.image }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The Synology DS923+ is amd64: no arm64 build needed
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/${{ matrix.image }}/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.names.outputs.image }}:selfhost
            ${{ steps.names.outputs.image }}:selfhost-${{ needs.source.outputs.date }}-${{ needs.source.outputs.short }}
            ${{ steps.names.outputs.image }}:src-${{ needs.source.outputs.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.source.outputs.sha }}
            org.opencontainers.image.description=${{ github.repository }} ${{ env.BRANCH }} ${{ needs.source.outputs.short }}, with ${{ env.UPSTREAM }} ${{ env.UPSTREAM_REF }} up to ${{ needs.source.outputs.upstream }}
          cache-from: type=gha,scope=selfhost-${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=selfhost-${{ matrix.image }}

  summary:
    name: Summary
    needs: [source, images]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          {
            echo '### Self-hosted images'
            case '${{ needs.source.result }}/${{ needs.source.outputs.build }}/${{ needs.images.result }}' in
              success/false/*) echo 'Commit `${{ needs.source.outputs.short }}` was already built: skipped.' ;;
              success/true/success) echo 'Published `selfhost` and `selfhost-${{ needs.source.outputs.date }}-${{ needs.source.outputs.short }}` (upstream up to `${{ needs.source.outputs.upstream }}`).' ;;
              *) echo 'Failed: see the jobs above. Nothing changed on the NAS.' ;;
            esac
          } >> "$GITHUB_STEP_SUMMARY"
